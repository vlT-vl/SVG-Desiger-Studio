<svg version="1.2" baseProfile="tiny-ps" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>SVG Designer icon</title>
  <style>
    :root {
      --bg-start: #20242D;
      --bg-end: #111318;
      --accent-start: #8EEBFF;
      --accent-end: #4A6CFF;
      --soft-fill: #FFFFFF;
      --soft-opacity: 0.045;
      --pen-fill: #171B24;
      --pen-stroke: #EAF2FF;
      --shadow-opacity: 0.35;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-start: #F4F7FB;
        --bg-end: #DDE6F3;
        --accent-start: #007AFF;
        --accent-end: #254DDB;
        --soft-fill: #111827;
        --soft-opacity: 0.045;
        --pen-fill: #FFFFFF;
        --pen-stroke: #172033;
        --shadow-opacity: 0.18;
      }
    }
  </style>
  <defs>
    <linearGradient id="bgGradient" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--bg-start)"/>
      <stop offset="100%" stop-color="var(--bg-end)"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="140" y1="120" x2="380" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--accent-start)"/>
      <stop offset="100%" stop-color="var(--accent-end)"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="var(--shadow-opacity)"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="88" fill="url(#bgGradient)"/>
  <circle cx="256" cy="256" r="150" fill="var(--soft-fill)" opacity="var(--soft-opacity)"/>
<!--Shape circolare-->
  <path d="M256 148
           C316 148 364 196 364 256
           C364 316 316 364 256 364
           C196 364 148 316 148 256
           C148 196 196 148 256 148Z" fill="none" stroke="url(#accentGradient)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)"/>
<!--Pen nib-->
  <g transform="translate(312 300) rotate(-16)" filter="url(#softShadow)">
    <path d="M0 0 L86 28 L34 96 Z" fill="var(--pen-fill)" stroke="var(--pen-stroke)" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
